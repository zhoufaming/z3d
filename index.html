<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bambu 3MF Studio</title>
</head>
<body>
  <!-- SVG 图标精灵 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="ic" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <g id="ic-move"><path d="M12 3v18M3 12h18"/><path d="M12 3l-2.4 2.6M12 3l2.4 2.6M12 21l-2.4-2.6M12 21l2.4-2.6M3 12l2.6-2.4M3 12l2.6 2.4M21 12l-2.6-2.4M21 12l-2.6 2.4"/></g>
        <g id="ic-rotate"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 5v6h-6"/></g>
        <g id="ic-scale"><path d="M4 9l-1-5 5 1M20 15l1 5-5-1M4 15l-1 5 5-1M20 9l1-5-5 1"/></g>
        <g id="ic-drop"><path d="M12 4v11"/><path d="M12 15l-3.2-3.2M12 15l3.2-3.2"/><path d="M5 20h14"/></g>
        <g id="ic-center"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3.2M12 17.8V21M3 12h3.2M17.8 12H21"/></g>
        <g id="ic-duplicate"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M4.5 15.5h-1A1.5 1.5 0 0 1 2 14V4a1.5 1.5 0 0 1 1.5-1.5H14a1.5 1.5 0 0 1 1.5 1.5v1"/></g>
        <g id="ic-arrange"><rect x="3.5" y="3.5" width="6" height="6" rx="1.3"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.3"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.3"/><rect x="14.5" y="14.5" width="6" height="6" rx="1.3"/></g>
        <g id="ic-delete"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/></g>
        <g id="ic-import"><path d="M12 15V4"/><path d="M8 9l4 5 4-5"/><path d="M4 19h16"/></g>
        <g id="ic-add"><path d="M12 5v14M5 12h14"/></g>
        <g id="ic-export"><path d="M12 4v11"/><path d="M8 9l4-5 4 5"/><path d="M4 19h16"/></g>
        <g id="ic-new"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 3v10M5 7l7 4 7-4"/></g>
        <g id="ic-undo"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-3"/></g>
        <g id="ic-redo"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h3"/></g>
        <g id="ic-split"><path d="M12 3v18"/><path d="M7 8l5-5 5 5M7 16l5 5 5-5"/></g>
        <g id="ic-mirror"><path d="M12 3v18"/><path d="M12 7l4 4-4 4M12 7l-4 4 4 4"/><path d="M5 12h2M17 12h2"/></g>
        <g id="ic-array"><rect x="3.5" y="3.5" width="5" height="5" rx="1"/><rect x="10.5" y="3.5" width="5" height="5" rx="1"/><rect x="17.5" y="3.5" width="3" height="5" rx="1"/><rect x="3.5" y="10.5" width="5" height="5" rx="1"/><rect x="10.5" y="10.5" width="5" height="5" rx="1"/></g>
        <g id="ic-merge"><path d="M4 7h7a4 4 0 0 1 4 4v10M20 17h-7a4 4 0 0 1-4-4V3"/></g>
        <g id="ic-base"><path d="M4 18h16M6 18v-6a6 6 0 0 1 12 0v6"/><path d="M12 12V5M9 5h6"/></g>
        <g id="ic-measure"><path d="M5 19 19 5"/><path d="M7.6 16.4l1.4-1.4M11 13l1.4-1.4M14.4 9.6 16 8"/></g>
        <g id="ic-help"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.6a2.6 2.6 0 1 1 3.7 2.3c-.9.4-1.1 1-1.1 1.9"/><path d="M12 16.4v.4"/></g>
      </g>
    </defs>
  </svg>

  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="logo"></span>
        <span class="title">Bambu 3MF Studio</span>
      </div>
      <nav class="top-tabs">
        <button class="tab active">编辑</button>
      </nav>
      <div class="top-actions">
        <select id="plate-select" class="select" title="打印机机型"></select>
        <button id="btn-import" class="btn primary">
          <svg class="ic"><use href="#ic-import"/></svg>导入 3MF
        </button>
        <button id="btn-add" class="btn">
          <svg class="ic"><use href="#ic-add"/></svg>追加合并
        </button>
        <div class="new-wrap">
          <button id="btn-new" class="btn">
            <svg class="ic"><use href="#ic-new"/></svg>新建模型<span class="caret">▾</span>
          </button>
          <div id="new-shape-panel" class="new-shape-panel hidden"></div>
        </div>
        <span class="sep"></span>
        <button id="btn-undo" class="btn icon" title="撤销 (Ctrl+Z)" disabled>
          <svg class="ic"><use href="#ic-undo"/></svg>
        </button>
        <button id="btn-redo" class="btn icon" title="重做 (Ctrl+Shift+Z)" disabled>
          <svg class="ic"><use href="#ic-redo"/></svg>
        </button>
        <span class="sep"></span>
        <button id="btn-export" class="btn primary">
          <svg class="ic"><use href="#ic-export"/></svg>导出 3MF
        </button>
        <button id="btn-export-stl" class="btn">
          <svg class="ic"><use href="#ic-export"/></svg>导出 STL
        </button>
        <button id="btn-help" class="btn icon" title="快捷键与帮助">
          <svg class="ic"><use href="#ic-help"/></svg>
        </button>
        <label class="ai-toggle" title="开启后可由外部 AI / 脚本经本地服务自动操控软件修改模型">
          <input type="checkbox" id="ai-enable"> AI 辅助
        </label>
      </div>
    </header>

    <main id="workspace">
      <aside id="left-panel">
        <div id="plate-bar" class="plate-bar"></div>
        <div class="panel grow">
          <div class="panel-head">
            <span>对象</span>
            <span class="count" id="obj-count">0</span>
          </div>
          <div id="object-tree" class="scroll"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><span>材料槽位</span></div>
          <div id="filament-list" class="scroll filaments"></div>
        </div>
      </aside>

      <section id="viewport">
        <canvas id="canvas3d"></canvas>
        <div id="dropzone" class="dropzone">
          <div class="dz-inner">
            <div class="dz-icon"></div>
            <div class="dz-title">拖入 .3mf 文件</div>
            <div class="dz-sub">支持同时拖入多个文件进行组合</div>
          </div>
        </div>
        <div id="viewport-hud">
          <span id="hud-stats"></span>
          <span id="sel-badge" class="sel-badge" style="display:none"></span>
        </div>
        <button id="btn-clear-measure" class="viewport-btn hidden">
          <svg class="ic"><use href="#ic-delete"/></svg>清除测量
        </button>
      </section>

      <div id="right-toolbar">
        <div id="gizmo-mode" class="tool-group">
          <button data-mode="translate" class="tool active" title="移动 (W)">
            <svg class="ic"><use href="#ic-move"/></svg><span>移动</span>
          </button>
          <button data-mode="rotate" class="tool" title="旋转 (E)">
            <svg class="ic"><use href="#ic-rotate"/></svg><span>旋转</span>
          </button>
          <button data-mode="scale" class="tool" title="缩放 (R)">
            <svg class="ic"><use href="#ic-scale"/></svg><span>缩放</span>
          </button>
        </div>
        <div class="tool-sep"></div>
        <button id="btn-drop" class="tool" title="落到热床">
          <svg class="ic"><use href="#ic-drop"/></svg><span>落板</span>
        </button>
        <button id="btn-center" class="tool" title="移到热床中心">
          <svg class="ic"><use href="#ic-center"/></svg><span>居中</span>
        </button>
        <button id="btn-duplicate" class="tool" title="复制 (Ctrl+D)">
          <svg class="ic"><use href="#ic-duplicate"/></svg><span>复制</span>
        </button>
        <div class="mirror-wrap">
          <button id="btn-mirror" class="tool" title="镜像（X/Y/Z 轴）">
            <svg class="ic"><use href="#ic-mirror"/></svg><span>镜像</span>
          </button>
          <div id="mirror-panel" class="pop-panel hidden">
            <div class="pop-title">沿轴镜像</div>
            <div class="mode-row">
              <button class="btn block" data-axis="x">X 轴</button>
              <button class="btn block" data-axis="y">Y 轴</button>
              <button class="btn block" data-axis="z">Z 轴</button>
            </div>
          </div>
        </div>
        <div class="array-wrap">
          <button id="btn-array" class="tool" title="阵列（线性 / 圆形）">
            <svg class="ic"><use href="#ic-array"/></svg><span>阵列</span>
          </button>
          <div id="array-panel" class="pop-panel hidden">
            <div class="pop-title">阵列</div>
            <div class="mode-row">
              <label class="radio"><input type="radio" name="array-mode" value="linear" checked><span>线性</span></label>
              <label class="radio"><input type="radio" name="array-mode" value="circular"><span>圆形</span></label>
            </div>
            <label class="field">数量
              <input type="number" id="array-count" step="1" min="2" value="3">
            </label>
            <div id="array-linear-opts" class="opt-row">
              <label class="field">方向
                <select id="array-axis"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select>
              </label>
              <label class="field">间距 (mm)
                <input type="number" id="array-spacing" step="1" value="40">
              </label>
            </div>
            <div id="array-circular-opts" class="opt-row hidden">
              <label class="field">半径 (mm)
                <input type="number" id="array-radius" step="1" value="60">
              </label>
            </div>
            <button id="array-go" class="btn primary block">生成阵列</button>
          </div>
        </div>
        <button id="btn-merge" class="tool" title="合并选中对象（Shift 多选可合并多个）">
          <svg class="ic"><use href="#ic-merge"/></svg><span>合并</span>
        </button>
        <button id="btn-base" class="tool" title="自动为选中对象生成底座 / 支撑">
          <svg class="ic"><use href="#ic-base"/></svg><span>底座</span>
        </button>
        <button id="btn-repair" class="tool" title="网格修复（焊接 / 封洞 / 剔除退化）">
          <svg class="ic"><use href="#ic-merge"/></svg><span>修复</span>
        </button>
        <div class="clip-wrap">
          <button id="btn-clip" class="tool" title="剖面 / 裁剪平面">
            <svg class="ic"><use href="#ic-split"/></svg><span>剖面</span>
          </button>
          <div id="clip-panel" class="pop-panel hidden">
            <div class="pop-title">剖面裁剪</div>
            <label class="field">轴向
              <select id="clip-axis">
                <option value="z">Z（水平）</option>
                <option value="x">X</option>
                <option value="y">Y</option>
              </select>
            </label>
            <label class="field">位置 (mm)
              <input type="number" id="clip-pos" step="1" value="0">
            </label>
            <label class="chk"><input type="checkbox" id="clip-on"> 启用裁剪（隐藏切割面一侧）</label>
            <div class="hint">保留法线指向切割面一侧的模型部分。</div>
          </div>
        </div>
        <div class="bool-wrap">
          <button id="btn-boolean" class="tool" title="布尔运算（需选中 2 个对象）">
            <svg class="ic"><use href="#ic-merge"/></svg><span>布尔</span>
          </button>
          <div id="bool-panel" class="pop-panel hidden">
            <div class="pop-title">布尔运算（A − B）</div>
            <div class="hint">需恰好选中 2 个对象；列表首项为 A，次项为 B。</div>
            <div class="mode-row">
              <button class="btn block" data-op="union">并集</button>
              <button class="btn block" data-op="difference">差集 (A−B)</button>
              <button class="btn block" data-op="intersection">交集</button>
            </div>
          </div>
        </div>
        <button id="btn-measure" class="tool" title="测量两点距离 (M)">
          <svg class="ic"><use href="#ic-measure"/></svg><span>测量</span>
        </button>
        <button id="btn-arrange" class="tool" title="自动排列全部">
          <svg class="ic"><use href="#ic-arrange"/></svg><span>排列</span>
        </button>
        <div class="split-wrap">
          <button id="btn-split" class="tool" title="拆件（拆分 / 切割）">
            <svg class="ic"><use href="#ic-split"/></svg><span>拆件</span>
          </button>
          <div id="split-panel" class="pop-panel hidden">
            <div class="pop-title">拆件</div>
            <div class="mode-row">
              <label class="radio"><input type="radio" name="split-mode" value="shells" checked><span>连通体拆分</span></label>
              <label class="radio"><input type="radio" name="split-mode" value="plane"><span>平面切割</span></label>
            </div>
            <div id="split-shells-opts" class="opt-row">
              <label class="field">最小体积 (mm³)
                <input type="number" id="split-minvol" step="1" min="0" value="0" title="小于此体积的碎屑壳体将并入最大件">
              </label>
              <label class="field">最大件数
                <input type="number" id="split-maxpieces" step="1" min="1" value="999" title="最多拆出的件数，超出部分并入最大件">
              </label>
            </div>
            <div id="split-plane-opts" class="opt-row hidden">
              <label class="field">轴向
                <select id="split-axis">
                  <option value="z">Z（水平）</option>
                  <option value="x">X</option>
                  <option value="y">Y</option>
                </select>
              </label>
              <label class="field">位置 (mm)
                <input type="number" id="split-pos" step="1" value="0">
              </label>
              <label class="chk"><input type="checkbox" id="split-cap" checked> 截面封盖（实心）</label>
            </div>
            <label class="chk grid"><input type="checkbox" id="split-grid"> 网格整齐排列</label>
            <label class="chk grid"><input type="checkbox" id="split-base"> 切割后添加底座</label>
            <button id="split-go" class="btn primary block">执行拆件</button>
          </div>
        </div>
        <div class="tool-sep"></div>
        <button id="btn-delete" class="tool danger" title="删除 (Del)">
          <svg class="ic"><use href="#ic-delete"/></svg><span>删除</span>
        </button>
      </div>

      <aside id="right-panel">
        <div class="panel-head"><span>属性</span></div>
        <div id="inspector" class="scroll"></div>
      </aside>
    </main>

    <footer id="statusbar">
      <span id="status-text">就绪</span>
      <span class="spacer"></span>
      <span id="status-meta"></span>
    </footer>
  </div>

  <input type="file" id="file-input" accept=".3mf" multiple hidden />
  <div id="help-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span>快捷键与操作</span><button id="help-close" class="modal-x" title="关闭 (Esc)">✕</button></div>
      <div class="modal-body" id="help-body"></div>
    </div>
  </div>
  <div id="toast-host"></div>
  <div id="ctx-menu" class="ctx-menu"></div>

  <!-- AI 辅助控制面板（opt-in，默认隐藏，开启 AI 辅助开关后显示） -->
  <div id="ai-panel" class="ai-panel hidden">
    <div class="ai-head">
      <span>AI 辅助控制</span>
      <button id="ai-close" class="ai-x" title="收起">✕</button>
    </div>
    <div class="ai-status-row">
      <span>状态：<b id="ai-status" class="ai-off">已关闭</b></span>
    </div>
    <div class="ai-meta">
      <span>端口：<code id="ai-port">—</code></span>
      <span>Token：<code id="ai-token">—</code></span>
    </div>
    <div class="ai-hint">
      开启后外部 AI 可 POST 命令到 <code>http://127.0.0.1:5199/command</code>（需带 token，
      见上方 Token）。也可直接在下方输入：JSON 命令、命令计划，或自然语言。
    </div>
    <textarea id="ai-input" class="ai-input" placeholder='输入指令，如：把 立方体A 和 立方体B 做并集；或 {"cmd":"scene"}'></textarea>
    <div id="ai-samples" class="ai-samples">
      <button data-sample='把 立方体A 和 立方体B 做并集'>并集</button>
      <button data-sample='把 A 减去 B'>差集</button>
      <button data-sample='修复全部'>修复</button>
      <button data-sample='镜像 B 沿 x 轴'>镜像</button>
      <button data-sample='把 A 变成红色'>改色</button>
      <button data-sample='{"cmd":"scene"}'>查询场景</button>
    </div>
    <div class="ai-actions">
      <button id="ai-run" class="btn primary">执行 (Ctrl+Enter)</button>
      <button id="ai-clear" class="btn">清空日志</button>
    </div>
    <div id="ai-log" class="ai-log"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
